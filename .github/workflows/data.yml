name: Validate data and bump version

on:
  pull_request:
    paths: ['data/**', 'scripts/**', 'tests/scents/**', 'apps/scent-atlas.html', 'dist/scent-atlas.html', 'docs/scent-intake.md', 'docs/scent-geography.md', 'README.md', 'package.json']
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**', 'tests/scents/**', 'apps/scent-atlas.html', 'dist/scent-atlas.html', 'docs/scent-intake.md', 'docs/scent-geography.md', 'README.md', 'package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate (pull requests)
        if: github.event_name == 'pull_request'
        run: node scripts/build.mjs --check

      - name: Validate and rebuild version.json (main)
        if: github.event_name != 'pull_request'
        run: node scripts/build.mjs

      - name: Test Scent Atlas geography schema and snapshot builder
        run: npm run test:scent-geography

      - name: Verify standalone Scent Atlas snapshot
        run: npm run check:scent-atlas

      - name: Commit version.json if it changed
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet version.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add version.json
            git commit -m "Bump data version [skip ci]"
            git push
          fi
