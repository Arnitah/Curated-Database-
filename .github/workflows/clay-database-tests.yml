name: Clay database tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/clay-database-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/clay-database-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clay-database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Run Clay pgTAP tests
        run: supabase test db
      - name: Lint local database
        run: supabase db lint --fail-on error
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
