name: Clay tests (advisory)

# Runs Clay application tests against an in-memory fake and Supabase migration tests against an isolated local database. No hosted project or real user data.
# ADVISORY: this is not a required check. A red run is a signal to look, not a merge block. Making it required is a repository setting, decided separately.
# Read-only: it never commits, pushes or deploys anything.
on:
  pull_request:
    paths:
      - 'apps/clay.html'
      - 'apps/ingredient-intelligence/**'
      - 'tests/clay/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/clay-tests.yml'
      - 'supabase/**'
  push:
    branches: [main]
    paths:
      - 'apps/clay.html'
      - 'apps/ingredient-intelligence/**'
      - 'tests/clay/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/clay-tests.yml'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clay-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
      - name: Assign isolated Supabase ports for this CI run
        shell: bash
        run: |
          offset=$(( (GITHUB_RUN_ID % 1000) * 4 ))
          api_port=$((55000 + offset))
          db_port=$((api_port + 1))
          shadow_port=$((api_port + 2))
          studio_port=$((api_port + 3))
          sed -i "s/^port = 54321$/port = ${api_port}/" supabase/config.toml
          sed -i "s/^port = 54322$/port = ${db_port}/" supabase/config.toml
          sed -i "s/^shadow_port = 54320$/shadow_port = ${shadow_port}/" supabase/config.toml
          sed -i "s/^port = 54323$/port = ${studio_port}/" supabase/config.toml
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Run Clay pgTAP tests
        run: supabase test db
      - name: Lint local database
        run: supabase db lint --fail-on error
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  clay-tests:
    # Playwright 1.55.1 does not support the ubuntu-latest image currently resolving to Ubuntu 26.04.
    # Pin this browser job to the supported 24.04 image; keep the independent database job on ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run engine and Clay tests
        run: npm run test:ci
      - name: Keep screenshots from failed checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clay-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
