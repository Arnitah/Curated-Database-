name: Clay standalone Pages build

on:
  pull_request:
    paths:
      - 'apps/clay.html'
      - 'apps/clay-sync/**'
      - 'apps/clay-web/**'
      - 'apps/clay-web/functions/api/clay/**'
      - '.github/workflows/clay-pages-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clay-pages-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/clay-web/package.json
      - name: Install isolated app dependencies
        run: npm install --prefix apps/clay-web
      - name: Build standalone app
        run: npm run build --prefix apps/clay-web
      - name: Test build contract
        run: npm run test:build --prefix apps/clay-web
      - name: Verify generated app bundle
        run: |
          test -s apps/clay-web/dist/index.html
          test -d apps/clay-web/dist/assets
          ! grep -R -n 'localStorage' apps/clay-web/dist/assets/clay-app-*.js
      - name: Verify bundled Pages Function
        run: test -s apps/clay-web/.wrangler/functions/index.js
      - name: Smoke-test local Pages routes
        run: npm run test:preview --prefix apps/clay-web
      - uses: actions/upload-artifact@v4
        with:
          name: clay-pages-preview-build
          path: |
            apps/clay-web/dist/
            apps/clay-web/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit resolved app dependency lockfile
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/clay-web/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile is already current."
          else
            git commit -m "Lock Clay Pages app dependencies"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
