<title>Clay Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..600,100;1,9..144,400..600,100&family=Nunito+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: desktop app shell — left sidebar nav · main column · right rail. Rail drops below main under 1100px; sidebar turns into a top strip under 760px.
   Palettes are explicit themes the reviewer picks (each commits to its own light or dark world). */
:root{
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --body:'Nunito Sans', 'Helvetica Neue', Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  /* Clay (current) — default light */
  --bg:#F3ECE1; --surface:#FBF8F2; --s2:#EDE4D6; --ink:#2B211A; --muted:#6B5B4D; --line:#E2D7C6;
  --accent:#94482B; --on-accent:#FFFFFF; --accent-soft:#F1DFD3;
  --ok:#4C5B32; --ok-soft:#E5E8D5; --warn:#6B4E14; --warn-soft:#F4E8CC; --stop:#8A2E1C; --stop-soft:#F6DDD2;
  --spring:#7E9A5A; --summer:#D19A2A; --fall:#B8643F; --winter:#5E7A8C;
  --shadow:0 1px 2px rgba(43,33,26,.06), 0 8px 24px rgba(43,33,26,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-palette]){
    --bg:#130D18; --surface:#1D1424; --s2:#2D1B31; --ink:#F3EAF2; --muted:#BCA9C0; --line:#3A2640;
    --accent:#E07FB4; --on-accent:#130D18; --accent-soft:#3A1F3A;
    --ok:#A9C9A0; --ok-soft:#1F2A1F; --warn:#E9C47E; --warn-soft:#33281A; --stop:#F2948C; --stop-soft:#3A1C22;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-palette]){
  --bg:#130D18; --surface:#1D1424; --s2:#2D1B31; --ink:#F3EAF2; --muted:#BCA9C0; --line:#3A2640;
  --accent:#E07FB4; --on-accent:#130D18; --accent-soft:#3A1F3A;
  --ok:#A9C9A0; --ok-soft:#1F2A1F; --warn:#E9C47E; --warn-soft:#33281A; --stop:#F2948C; --stop-soft:#3A1C22;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;

:root[data-palette="cocoa"][data-time="am"]{--bg:#EEE6DF;--surface:#FAF6F2;--s2:#DFD0C4;--ink:#1F1714;--muted:#5B493E;--line:#DCCDBF;--accent:#6A4E3D;--on-accent:#FFFFFF;--accent-soft:#E6D8CC;--ok:#45603A;--ok-soft:#E1E8D8;--warn:#6B4D16;--warn-soft:#F1E5CC;--stop:#922F22;--stop-soft:#F3DBD3;--shadow:0 1px 2px rgba(31,23,20,.06),0 8px 24px rgba(31,23,20,.07);color-scheme:light}

:root[data-palette="clay"][data-time="pm"]{--bg:#1E1712;--surface:#2A211A;--s2:#342A22;--ink:#F3EBDD;--muted:#BBA996;--line:#43362B;--accent:#EBA585;--on-accent:#1E1712;--accent-soft:#3E2519;--ok:#B9C79A;--ok-soft:#2E3424;--warn:#E8C77F;--warn-soft:#3A2E19;--stop:#F2948C;--stop-soft:#3E2220;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}

:root[data-palette="dusk"][data-time="am"]{--bg:#F2EEEA;--surface:#FFFFFF;--s2:#E3EAEC;--ink:#14253B;--muted:#4F5E6E;--line:#DCE3E6;--accent:#8D4334;--on-accent:#FFFFFF;--accent-soft:#F3DCD5;--ok:#2F6A5E;--ok-soft:#DDEDE9;--warn:#6B4E14;--warn-soft:#F4E8CC;--stop:#9B2C2C;--stop-soft:#F6DADA;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);color-scheme:light}
:root[data-palette="chameleon"][data-time="pm"]{--bg:#1A110A;--surface:#24180F;--s2:#322214;--ink:#F6EEE6;--muted:#D9BC9E;--line:#3D2A1A;--accent:#9DAEF5;--on-accent:#1A110A;--accent-soft:#1F2648;--ok:#A9C99A;--ok-soft:#24301D;--warn:#E8C687;--warn-soft:#3A2E18;--stop:#F29A8C;--stop-soft:#43231C;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}

:root[data-palette="cocoa"][data-time="pm"]{--bg:#1F1714;--surface:#2A201C;--s2:#38312F;--ink:#F3ECE6;--muted:#C9B6A6;--line:#433833;--accent:#E2C3AC;--on-accent:#1F1714;--accent-soft:#44352C;--ok:#ADC79F;--ok-soft:#283023;--warn:#E6C88A;--warn-soft:#3A2F1E;--stop:#F09A8C;--stop-soft:#432520;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:450;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(28px,3.2vw,38px);line-height:1.1}
h2{font-size:21px;line-height:1.25}
h3{font-size:17px;line-height:1.3;font-weight:500}
p{margin:0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:20px;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 10px}
.brand b{font-family:var(--display);font-size:30px;font-weight:500;letter-spacing:-.02em}
.brand span{font-size:13px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:none;color:var(--muted);font-weight:600;font-size:15px;text-align:left}
.nav button:hover{background:var(--s2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
.profile-chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--s2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700}

.main-wrap{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:24px 64px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.topbar .grow{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);max-width:420px;width:100%}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--ink)}
.page{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.rail{display:flex;flex-direction:column;gap:20px;position:sticky;top:24px}
.head{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}

/* ---------- controls */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;background:var(--s2)}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--s2);font-size:13px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.stop{background:var(--stop-soft);color:var(--stop)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wrap{flex-wrap:wrap}

/* ---------- surfaces */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flat{background:var(--s2);border-color:transparent}
.card.ok{background:var(--ok-soft);border-color:transparent}
.card.warn{background:var(--warn-soft);border-color:transparent}
.card.stop{background:var(--stop-soft);border-color:transparent}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-head h2,.card-head h3{flex:1;min-width:0}
.cmt{min-height:32px;padding:0 10px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:13px;font-weight:600;display:none;align-items:center;gap:6px}
.feedback-on .cmt{display:inline-flex}
.cmt:hover{color:var(--accent);border-color:var(--accent)}
.list>*+*{border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* ---------- product art */
.pack{flex-shrink:0;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pack svg{display:block}
.pack .b{fill:color-mix(in oklab, var(--surface) 70%, transparent);stroke:color-mix(in oklab, var(--ink) 38%, transparent);stroke-width:1.2}
.pack .lb{fill:color-mix(in oklab, var(--ink) 12%, transparent);stroke:none}

/* ---------- steps */
.step{display:flex;gap:14px;align-items:flex-start;padding:14px 0;background:none;border:0;width:100%;text-align:left}
.tick{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);flex-shrink:0;display:grid;place-items:center;margin-top:2px}
.step[aria-pressed="true"] .tick{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step[aria-pressed="true"] .sname{text-decoration:line-through;color:var(--muted)}
.slabel{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sname{font-weight:700;font-size:16px}
.hint{font-family:var(--display);font-style:italic;font-size:15px;color:var(--ink);opacity:.86}
.progress{height:6px;border-radius:999px;background:var(--s2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}

/* ---------- layering stack */
.stack{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:26px;background:color-mix(in oklab, var(--ink) 88%, var(--bg));}
.layer{border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#2B211A}

/* ---------- pairs */
.pair{display:grid;grid-template-columns:auto auto auto minmax(0,1fr);gap:10px;align-items:center;padding:16px 0}
.op{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:19px;background:color-mix(in oklab, var(--season) 20%, var(--surface));color:var(--ink)}
.pair .res{font-family:var(--display);font-size:17px;line-height:1.35}
.seasonbar{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--season)}
.pick{border-radius:20px;padding:20px;background:color-mix(in oklab, var(--season,var(--accent)) 14%, var(--surface));border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.pick .lbl{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--muted)}
.pick .best{align-self:flex-start;font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--ink);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border-radius:12px;padding:12px 8px;text-align:center;font-size:13.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line)}
.quote{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px}

/* ---------- clay swatches */
.grid2>button:last-child:nth-child(odd){grid-column:1/-1}
.chiprow{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.claygrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:1300px){.claygrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.claygrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.smear{height:64px;border-radius:40% 55% 45% 60% / 60% 45% 55% 40%;}

/* ---------- popover */
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;z-index:20;display:flex;flex-direction:column;gap:6px}
.pal{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid transparent;background:none;text-align:left}
.pal:hover{background:var(--s2)}
.pal[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sw{display:flex;border-radius:8px;overflow:hidden;height:22px;width:120px;border:1px solid var(--line)}
.sws{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.sws small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sw i{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30}

[hidden]{display:none!important}
.seg{max-width:100%;overflow-x:auto}
#main:focus{outline:none}
.seg.fill{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
.seg.fill button{padding:0 6px;font-size:14px;gap:5px}
.rail .seg.fill button .dot{display:none}
/* ---------- responsive */

function realRoutine(t){
  const F=MP.filter(p=>p.a==='face'&&p.s==='cur'), by=st=>F.filter(p=>p.st===st), ac=acidTonight(), out=[];
  const add=(p,label,hint)=>{ const [sh,ti]=look(p); out.push([label,shortName(p.n),hint||amInfo(p).how,sh,ti]); };
  const gap=(label,name,hint)=>out.push([label,name,hint,'bottle','#E6E3DC',1]);
  by('Cleanser').slice(0,1).forEach(p=>add(p,t==='am'?'Cleanse · optional in the morning':'Cleanse · every night',t==='am'?'Splash with water, or a small amount if you’re oily.':''));
  by('Toner').forEach(p=>{ if(ACID.test(p.n)){ if(t==='pm'&&ac&&ac.on) add(p,'Exfoliate · tonight',amInfo(p).how+' Skip other actives tonight.'); } else add(p,'Tone · daily'); });
  by('Skin conditioner').forEach(p=>add(p,'Hydrate · daily'));
  by('Serum').forEach(p=>{ if(t==='am'&&RETI.test(p.n)) return; add(p,'Serum · daily'); });
  if(t==='pm') by('Treatment').forEach(p=>{ if(ac&&ac.on) return; add(p,'Treat · on spots only'); });
  by('Eye').forEach(p=>add(p,'Eye · daily'));

}

const MP_ACTIVE=/glycolic|lactic|mandelic|salicylic|\bbha\b|\baha\b|retin|adapalene|differin|tretinoin|benzoyl|panoxyl|azelaic|vitamin c|ascorbic|kojic|spot correct|peel|exfoliat|tranexamic|hydroquinone|resurfac/i;

const dFmt=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function rampInfo(p){
  if(!p.startAt) return null;
  const now=dDay(), D=864e5;
  if(p.irrAt&&now-p.irrAt<5*D) return {stage:'pause',pct:0,label:'Paused after irritation',freq:`Skip it until ${dFmt(p.irrAt+5*D)}. Then restart at 2 nights a week, and moisturise first (buffering).`};
  const from=p.irrAt?p.irrAt+5*D:p.startAt, days=Math.floor((now-from)/D), pct=Math.min(100,Math.round(days/28*100));
  if(days<14) return {stage:'w1',pct,days,label:`Week ${Math.floor(days/7)+1} of 4`,freq:'2 nights a week, with 2 nights off in between (e.g. Mon and Thu).'};
  if(days<28) return {stage:'w3',pct,days,label:`Week ${Math.floor(days/7)+1} of 4`,freq:'Every other night, if your skin feels calm.'};

function hairGoalCard(){
  const st=HR.setup, logs=(HR.logs||[]).slice().sort((a,b)=>a.d-b.d);
  const start=logs.length?logs[0].in:hIn(st.now), cur=logs.length?logs[logs.length-1].in:hIn(st.now), goal=hIn(st.goal);
  const gap=Math.max(0,goal-cur), mo=gap/0.5, lo=gap/0.6, hi=gap/0.3;
  const pct=goal>start?Math.max(0,Math.min(100,Math.round((cur-start)/(goal-start)*100))):100;
  const D=864e5, when=t=>new Date(t).toLocaleDateString(undefined,{month:'short',year:'numeric'});
  let ret='';
  if(logs.length>=2){ const months=(logs[logs.length-1].d-logs[0].d)/(30.4*D), exp=months*0.5, got=logs[logs.length-1].in-logs[0].in;
    if(months>=1) ret=`<div class="mp-chk ${got/exp>=.7?'mp-info':'mp-warn'}" style="margin-top:8px"><b class="small">Retention: about ${Math.max(0,Math.round(got/exp*100))}%</b><p class="small" style="margin:2px 0 0">You gained ${got.toFixed(1)}" in ${months.toFixed(1)} months; full retention would be about ${exp.toFixed(1)}". ${got/exp>=.7?'Your routine is keeping your growth.':'Some length is breaking off. Check the tips below: gentler detangling, moisture between washes, and lower-tension styles.'}</p></div>`; }

  let chart='';
  if(logs.length){ const W=300,H=110,P=24, t0=logs[0].d, tN=Math.max(logs[logs.length-1].d,t0+90*D), x=t=>P+(t-t0)/(tN-t0)*(W-P-8), mx=Math.max(goal,cur)+2, y=v=>H-P-(v-start+2)/(mx-start+2)*(H-P-8);
    chart=`<svg viewBox="0 0 ${W} ${H}" class="hr-chart" role="img" aria-label="Length over time"><line x1="${P}" y1="${y(goal)}" x2="${W-8}" y2="${y(goal)}" class="hr-goal"/><text x="${W-8}" y="${y(goal)-4}" text-anchor="end" class="hr-t">goal ${goal}"</text>
      <line x1="${x(t0)}" y1="${y(start)}" x2="${x(tN)}" y2="${y(start+(tN-t0)/(30.4*D)*0.5)}" class="hr-exp"/>
      <polyline points="${logs.map(l=>x(l.d)+','+y(l.in)).join(' ')}" class="hr-line"/>${logs.map(l=>`<circle cx="${x(l.d)}" cy="${y(l.in)}" r="4" class="hr-dot"><title>${new Date(l.d).toLocaleDateString()}: ${l.in}"</title></circle>`).join('')}</svg>
      <p class="small muted" style="margin:2px 0 0">Solid: the lengths you measured. Dashed: full retention at ½" a month.</p>`; }
  return card('Your length goal', `<div class="row" style="justify-content:space-between;gap:8px"><span class="small"><b>${esc((HL.find(x=>x[0]===st.now)||[])[1]||'')}</b> → <b>${esc((HL.find(x=>x[0]===st.goal)||[])[1]||'')}</b></span><button class="linkbtn small" type="button" data-act="hsedit">Edit setup</button></div>
    <div class="rm-bar" style="height:10px"><span style="width:${pct}%"></span></div>
    <p class="small" style="margin:6px 0 0">${gap>0?`About <b>${Math.round(mo)} months</b> to go at full retention (${when(Date.now()+lo*30.4*D)} to ${when(Date.now()+hi*30.4*D)}, since growth runs 0.3 to 0.6" a month).`:'You’ve reached your goal length. Now it’s about keeping your ends healthy.'}</p>
    ${chart}${ret}
    <div class="mp-add" style="margin-top:10px"><input id="hrIn" type="number" step="0.5" min="1" max="50" placeholder="Length today, inches (stretched)" aria-label="Length in inches"><button class="btn primary" type="button" data-act="hrlog">${ic('plus',16)}Log length</button></div>
    <p class="small muted" style="margin:4px 0 0">Measure the same section each month (e.g. the back, stretched from the scalp). ${logs.length?`${logs.length} check${logs.length>1?'s':''} logged.`:''}</p>`, {h:'h3', icon:'leaf'});
}
function hairCalCard(){
  const st=HR.setup, D=864e5, today=dDay(), every=hDays(st.wash);
  const addD=(t,n)=>{ const x=new Date(t); return new Date(x.getFullYear(),x.getMonth(),x.getDate()+n).getTime(); };
  const nextWash=HR.wash?addD(HR.wash,every):today, nextTrim=HR.trim?addD(HR.trim,84):today, prot=/Protective|Wigs/.test(st.style)&&HR.styleIn;
  const due=t=>t<=today?'<b style="color:var(--warn)">due now</b>':new Date(t).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const dn=t=>Math.round(t/D), td=new Date(today);
  const days=[...Array(28)].map((_,i)=>new Date(td.getFullYear(),td.getMonth(),td.getDate()+i).getTime()), ev=t=>{ const o=[], k=dn(t); if(HR.wash){ for(let n=every;n<=60;n+=every) if(k===dn(addD(HR.wash,n))) o.push('wash'); } else if(k===dn(today)) o.push('wash');
    if(HR.trim&&k===dn(nextTrim)) o.push('trim'); if(prot&&k===dn(addD(HR.styleIn,49))) o.push('takedown'); return o; };

  return card('Wash-day calendar', `<div class="grid2" style="gap:8px">
     <div class="rm-row"><span class="small muted">Next wash day</span><div class="small">${due(nextWash)}</div><button class="chip" type="button" data-act="hrwash" style="margin-top:6px">Washed today</button></div>
     <div class="rm-row"><span class="small muted">Next trim (every 12 weeks)</span><div class="small">${HR.trim?due(nextTrim):'Not logged yet'}</div><button class="chip" type="button" data-act="hrtrim" style="margin-top:6px">Trimmed today</button></div>

   </div>${strip}`, {h:'h3', icon:'today'});
}

const HTIPS={'Dryness':'Moisture lives in water: refresh with a water-based leave-in mid-week, then seal (LOC).','Breakage':'Most breakage is mechanical: detangle only when wet and conditioned, and cut back on daily combing.','Split ends':'Splits can’t be glued back. Trim every 12 weeks and you’ll keep more length, not less.','Tangles and knots':'Single-strand knots form on ends: detangle in sections and stretch hair (braids or twists) to sleep.','Thin edges':'Usually tension: skip tight ponytails, edge brushing and heavy wigs glued at the hairline. If they don’t recover in 6 months, see a dermatologist; long-standing traction loss can be permanent.','Shrinkage':'Shrinkage is a sign of healthy coils. Stretch with banding or twist-outs, not heat.','Dandruff or itchy scalp':'Flakes plus itch is usually a yeast: a ketoconazole or zinc pyrithione shampoo 1 to 2 times a week works better than oils, which can feed it.','Frizz':'Apply stylers to soaking-wet hair and let it dry without touching.'};
function hairTipsCard(){
  const st=HR.setup, t=st.str.filter(x=>HTIPS[x]);
  const extra=[]; if(st.hold.includes('Tried too many products')||st.hold.includes("Don't know what works")) extra.push('Change one product at a time and give it 4 wash days. Queue the rest in Try next above.');
  if(st.hold.includes('Lack of consistency')||st.hold.includes('No structured routine')) extra.push('Follow the wash-day calendar and guide; consistency matters more than which products you use.');
  if(st.hold.includes('Budget')) extra.push('A shampoo, a conditioner, a leave-in and an oil cover everything. Masks and growth serums are optional.');
  if(st.style==='Relaxed'||st.style==='Transitioning') extra.push('Where relaxed and natural hair meet is the weakest point: be extra gentle there, and use protein treatments every 4 to 6 weeks.');
  if(!t.length&&!extra.length) return '';
  return card('For your hair', `<div class="list">${t.map(x=>`<div class="mp-chk mp-info"><b class="small">${esc(x)}</b><p class="small" style="margin:2px 0 0">${esc(HTIPS[x])}</p></div>`).join('')}${extra.map(x=>`<div class="mp-chk mp-info"><p class="small" style="margin:0">${esc(x)}</p></div>`).join('')}</div>`, {h:'h3', icon:'info'});
}

function cmAnalyze(list){
  const items=list.split(/,(?!\d)|\n|•|·|;|\s[-–—|]\s/).map(x=>x.replace(/[*†‡]+/g,"").trim().toLowerCase()).filter(Boolean);
  if(items.length<3) return null;
  const lineAt=items.findIndex(x=>CM_LINE.test(x));
  const found=[], hype=[];
  items.forEach((x,i)=>{
    CM.forEach(a=>{ if(a.re.test(x)&&!found.some(f=>f.a.k===a.k)) found.push({a,pos:i,low:lineAt>=0&&i>lineAt}); });
    CM_HYPE.forEach(([re,n,t])=>{ if(re.test(x)&&!hype.some(h=>h.n===n)) hype.push({n,t,pos:i,low:lineAt>=0&&i>lineAt}); });
  });
  const oily=items.slice(0,5).filter(x=>/oil|butter|squalane|wax|triglyceride|ester|dimethicone/.test(x)).length>=3&&!items.slice(0,3).some(x=>/^aqua|^water/.test(x));
  const rinse=items.slice(0,8).some(x=>CM_SURF.test(x));
  const extracts=items.filter(x=>/extract|ekisu|ferment|filtrate/.test(x)&&!found.some(f=>f.a.re.test(x)));
  if(extracts.length>=3) hype.push({n:`${extracts.length} plant extracts`,t:"Usually tiny amounts that tell a label story. They rarely drive results.",low:false});
  const dyes=items.filter(x=>/^ci \d{5}|fd&c|yellow \d|red \d|blue \d|tartrazine/.test(x));
  if(dyes.length) hype.push({n:`Colorants (${dyes.map(d=>d.toUpperCase()).join(", ")})`,t:"Added only for color. CI 19140 (tartrazine) and CI 15985 can irritate a few people. Unnecessary in a product sold for sensitive skin.",low:false});
  const FA=items.filter(x=>/^(coumarin|cinnamal|eugenol|isoeugenol|linalool|limonene|citral|geraniol|citronellol|benzyl (salicylate|benzoate|cinnamate|alcohol)|hydroxycitronellal|farnesol|cinnamyl alcohol|amyl cinnamal|hexyl cinnamal|alpha-isomethyl ionone|anise alcohol|evernia)/.test(x));
  if(FA.length) hype.push({n:`Listed fragrance allergens (${FA.join(", ")})`,t:"Required on labels because some people react to them. Cinnamal, eugenol and coumarin are the more common culprits; skip it if spicy or sweet scents have irritated you before.",low:false});
  if(items.some(x=>/^(parfum|fragrance)/.test(x))) hype.push({n:"Fragrance",t:"Adds scent, not results, and is the most common cause of irritation. Odd in a product sold for sensitive skin.",low:false});
  if(items.some(x=>/sodium laur(eth|yl) sulfate/.test(x))) hype.push({n:"Sulfate cleanser (SLS or SLES)",t:"Effective and fine for most people, but drying for some. If the brand advertises \"sulfate-free\", check each product.",low:false});
  const mist=!rinse&&!oily&&items.slice(0,2).some(x=>/flower water|hydrosol|distillate|leaf water|herb water|fruit water/.test(x));
  return {items,lineAt,found,hype,oily,rinse,mist};
}

  try{ const [acts,hype,pg]=await Promise.all(['product_actives','product_hype_flags','proof_grades'].map(async nm=>ver.datasets['safe-batch/'+nm]?get('data/safe-batch/'+nm+'.json'):null));
    if(Array.isArray(acts)&&acts.length){ const have=new Map(CM.map((x,i)=>[x.k,i])); acts.forEach(a=>{ if(!a||!a.k||!a.re) return; try{ const o={...a,re:new RegExp(a.re)}; if(have.has(a.k)) CM[have.get(a.k)]=o; else CM.push(o); n++; }catch(e){} }); }
    if(Array.isArray(hype)){ const have=new Set(CM_HYPE.map(x=>x[1])); hype.forEach(([src,nm,t])=>{ if(have.has(nm)) return; try{ CM_HYPE.push([new RegExp(src),nm,t]); n++; }catch(e){} }); }
    if(pg&&typeof pg==='object'){ Object.entries(pg).forEach(([k,v])=>{ if(JSON.stringify(PG[k])!==JSON.stringify(v)){ PG[k]=v; n++; } }); }
  }catch(e){}
  window.CLAY_DATA={version:ver.version,changed:n};
  if(n) try{ render(); }catch(e){}
})();

(async()=>{
  try{
    const db=window.claude&&window.claude.use?await window.claude.use('db'):null;
    const user=window.claude&&window.claude.use?await window.claude.use('user'):null;
    const uid=user?await user.id():null;
    if(!db||!uid){ CSYNC.status='local'; return; }
    CSYNC.db=db; CSYNC.uid=uid; CSYNC.status='synced';
    let changed=false;
    for(const k of Object.keys(CS_GET)){
      try{
        const snap=await csRef(k).get();
        const remote=snap.exists?snap.data():null, lt=CSYNC.ts[k]||0;
        if(remote&&(remote.at||0)>lt){ CS_SET[k](remote.data); csStamp(k,remote.at); changed=true; }
        else if(lt||(!remote&&k!=='clay-prefs')) claySyncPush(k);   // first sign-in: upload what this device has
        csRef(k).onSnapshot(sn=>{ const r=sn.exists?sn.data():null; if(r&&(r.at||0)>(CSYNC.ts[k]||0)){ CS_SET[k](r.data); csStamp(k,r.at); try{ render(); }catch(e){} } },()=>{});
      }catch(e){ CSYNC.status='error'; }
    }
    if(changed) try{ render(); }catch(e){}
    else try{ render(); }catch(e){}
  }catch(e){ CSYNC.status='local'; }
})();

</script>

</body></html>
